services:
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-drive-blobs}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # Unhealthy here means the ./garage.toml bind mount is dangling, not that
      # the store is down. The container was created from a checkout that has
      # since moved or been deleted — a git worktree that ran
      # `make infra-init-test` and was then removed — so the mount resolves to
      # nothing, the probe reports "Unable to read configuration file
      # /etc/garage.toml", and S3 goes on serving throughout. Recreate the
      # container from the checkout you actually mean:
      #
      #   docker compose -p <project> --env-file <env> up -d
      #
      # -c names the file the probe reads instead of leaning on the default,
      # which is that same path: a note at the call site, not a fix. Passing it
      # changed no behaviour.
      #
      # There is no config-free probe to switch to. The image is FROM scratch
      # with only /garage in it, so there is no shell and no HTTP client for the
      # S3 or admin endpoints; `-s <secret>` alone is still refused; and `-h`
      # wants `<full-node-id>@host:port`, an id generated on the node's first
      # boot that nothing here can know in advance.
      #
      # Nothing in the stack gates on this check — no depends_on names it, and
      # infra-init waits on the S3 API itself — so a red dot in `docker ps` next
      # to a working store is cosmetic until the mount is repaired.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drive}
      POSTGRES_DB: ${POSTGRES_DB:-drive}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drive} -d ${POSTGRES_DB:-drive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  garage-meta:
  garage-data:
  postgres-data:
