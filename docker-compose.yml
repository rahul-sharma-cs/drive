services:
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-drive-blobs}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # This reads /etc/garage.toml — the file bind-mounted just above — for the
      # RPC address and secret, and -c says so at the call site rather than
      # leaving it to the default (which GARAGE_CONFIG_FILE could move).
      #
      # There is no config-free probe to switch to. The image is FROM scratch
      # with only /garage in it, so there is no shell and no HTTP client for the
      # S3 or admin endpoints; `-s <secret>` alone is still refused; and `-h`
      # wants `<full-node-id>@host:port`, an id generated on the node's first
      # boot that nothing here can know in advance.
      #
      # So when this reports "Unable to read configuration file /etc/garage.toml"
      # while the store is plainly serving, the mount is what broke and not the
      # store: the container was created from a directory that has since been
      # deleted — a git worktree that ran `make infra-init-test` and was then
      # removed. `docker compose -p <project> --env-file <env> up -d` from a live
      # checkout recreates the container against a path that exists.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drive}
      POSTGRES_DB: ${POSTGRES_DB:-drive}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drive} -d ${POSTGRES_DB:-drive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  garage-meta:
  garage-data:
  postgres-data:
